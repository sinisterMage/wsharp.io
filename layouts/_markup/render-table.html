{{- /* The reference tables lifted from the compiler's README are wide. Let them
       scroll inside their own box rather than pushing the page sideways. */ -}}
<div class="table-scroll">
<table>
    <thead>
        {{- range .THead }}
        <tr>
            {{- range . }}
            <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
            {{- end }}
        </tr>
        {{- end }}
    </thead>
    <tbody>
        {{- range .TBody }}
        <tr>
            {{- range . }}
            <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
            {{- end }}
        </tr>
        {{- end }}
    </tbody>
</table>
</div>

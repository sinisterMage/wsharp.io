# wsharp.io, inside the container. Traefik has already terminated TLS and
# redirected port 80 to 443 by the time a request arrives here, so this server
# block only has to find files.
#
# Lives at /docker/wsharp-io/nginx.conf on the server.

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # Hugo writes fingerprinted names for these in a production build, so the
    # URL changes whenever the bytes do.
    # `expires` would emit a second Cache-Control of its own, so the header is
    # written once, by hand.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(svg|png|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Everything else is HTML or the search index: revalidate every time, so a
    # deploy is visible immediately.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
